services:
  db:
    image: mariadb:10.11
    container_name: gamehub_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gamehub_db
      MYSQL_USER: gamehub_user
      MYSQL_PASSWORD: gamehub_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - gamehub_network

  backend:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.backend
    container_name: gamehub_backend
    user: root
    restart: unless-stopped
    working_dir: /var/www/html/backend
    volumes:
      - .:/var/www/html
    # ports:
    #   - "8000:8000"
    environment:
      - AUTORUN_ENABLED=false
      - PHP_OPCACHE_ENABLE=1
    command: >
      sh -lc "
        set -e;
        cd /var/www/html/backend;
        if [ ! -d vendor ]; then
          composer install --no-interaction --prefer-dist;
        fi;
        if [ ! -f .env ]; then
          cp .env.example .env;
        fi;
        if ! grep -q '^APP_KEY=base64:' .env; then
          php artisan key:generate --force;
        fi;
        php artisan octane:start --server=roadrunner --host=0.0.0.0 --rpc-port=6001 --port=8000 --workers=4
      "
    depends_on:
      - db
      - redis
    networks:
      - gamehub_network

  frontend:
    image: node:20-alpine
    container_name: gamehub_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    # ports:
    #   - "5174:5173"
    command: >
      sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - gamehub_network

  nginx:
    build:
      context: ./nginx
    container_name: gamehub_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - gamehub_network

  redis:
    image: redis:alpine
    container_name: gamehub_redis
    restart: unless-stopped
    networks:
      - gamehub_network

volumes:
  db_data:

networks:
  gamehub_network:
    driver: bridge
